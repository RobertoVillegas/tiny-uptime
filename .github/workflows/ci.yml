name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          # The same build profiles about twice as slow on a GitHub runner as on an M-series Mac
          # (11 ms vs 5 ms; Cloudflare itself reports 3 ms), so CI allows twice the local budget.
          STARTUP_BUDGET_MS: "20"
